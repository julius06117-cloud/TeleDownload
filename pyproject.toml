[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tgdl"
dynamic = ["version"]
description = "Agent-first Telegram group-chat file downloader (Telethon, resumable, concurrent)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Julius" }]
dependencies = [
    "telethon>=1.36,<2",
    "aiohttp>=3.9,<4",
    "PyYAML>=6",
    "python-dotenv>=1",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tgdl = "tgdl.cli:main"

[tool.setuptools.dynamic]
version = { attr = "tgdl.__version__" }

[tool.setuptools.packages.find]
include = ["tgdl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
